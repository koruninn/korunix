name: Aplicar cambio comprobado

on:
  push:
    branches:
      - desde-cero
    paths:
      - .github/korunix.patch

permissions:
  contents: write

jobs:
  aplicar-y-validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config

      - name: Aplicar el cambio
        run: |
          git apply --recount --check .github/korunix.patch
          git apply --recount .github/korunix.patch
          rm .github/korunix.patch

      - name: Formato e integridad
        run: |
          cargo fmt --all
          git diff --check

      - name: Probar el motor compartido
        run: cargo test --locked -- --test-threads=1

      - name: Probar la interfaz
        run: cargo check --locked --features interfaz --bin korunix-interfaz

      - name: Publicar solo si todo pasó
        run: |
          git config user.name "Korunix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "busca ajustes en todas las áreas"
          git push origin HEAD:desde-cero
