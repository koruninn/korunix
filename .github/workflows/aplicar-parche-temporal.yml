name: Aplicar cambio comprobado

on:
  push:
    branches:
      - desde-cero
    paths:
      - .github/korunix.patch

permissions:
  contents: write

jobs:
  aplicar-y-validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar el cambio
        run: |
          git apply --recount --check .github/korunix.patch
          git apply --recount .github/korunix.patch
          rm .github/korunix.patch
          git diff --check

      - name: Validar Rust solo cuando cambie
        run: |
          if git diff --name-only | grep -q '^src/'; then
            sudo apt-get update
            sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config
            cargo fmt --all
            git diff --check
            cargo test --locked -- --test-threads=1
            cargo check --locked --features interfaz --bin korunix-interfaz
          fi

      - name: Publicar
        run: |
          git config user.name "Korunix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "registra búsqueda global comprobada"
          git push origin HEAD:desde-cero
