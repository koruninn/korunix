name: Aplicar cambio comprobado

on:
  push:
    branches:
      - desde-cero
    paths:
      - .github/korunix.patch

permissions:
  contents: write

jobs:
  aplicar-y-validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registrar la búsqueda global
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ruta = Path("RUTA.md")
          texto = ruta.read_text()

          viejo = '''ancho normal
          → barra lateral visible
          → buscador de secciones
          → área elegida a la derecha

          ventana angosta
          → la barra lateral se oculta
          → un botón abre las secciones sobre el contenido
          → el área actual usa todo el ancho disponible
          '''

          nuevo = '''ancho normal
          → barra lateral visible
          → búsqueda global de ajustes, aplicaciones y áreas
          → cada área aporta términos de sus elementos internos
          → muestra solo las áreas donde puede estar la coincidencia
          → selecciona la primera coincidencia
          → área elegida a la derecha

          ventana angosta
          → la barra lateral se oculta
          → un botón abre las áreas y la misma búsqueda global sobre el contenido
          → el área actual usa todo el ancho disponible
          '''

          if texto.count(viejo) != 1:
              raise SystemExit("No encontré una sola vez el bloque de navegación anterior.")
          texto = texto.replace(viejo, nuevo, 1)

          ancla = (
              "La prueba de este avance incluye una aplicación curada, una elección libre, "
              "resolución real de `karere`, cambio de sección durante la consulta y ventana angosta. "
              "El frente **sigue abierto**: falta enriquecer las fichas con AppStream local, integrar "
              "las opciones propias dentro de sus fichas finales y pasar la puerta gráfica completa.\n\n"
          )

          registro = ancla + (
              "Corrección rescatada directamente del comportamiento ya comprobado en `pruebas`:\n\n"
              "```text\n"
              "búsqueda global\n"
              "→ no depende del área que estaba abierta\n"
              "→ busca términos humanos de todas las áreas\n"
              "→ Firefox / fotografías / Steam llevan a Aplicaciones\n"
              "→ Bluetooth / Niri llevan a Sistema\n"
              "→ teclado lleva a Personas\n"
              "→ restaurar lleva a Copias y recuperación\n"
              "```\n\n"
          )

          if texto.count(ancla) != 1:
              raise SystemExit("No encontré una sola vez el avance actual de Aplicaciones.")

          ruta.write_text(texto.replace(ancla, registro, 1))
          PY

          rm .github/korunix.patch
          git diff --check

      - name: Publicar
        run: |
          git config user.name "Korunix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "registra búsqueda global comprobada"
          git push origin HEAD:desde-cero
