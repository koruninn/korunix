name: Actualizar spec comprobado

on:
  push:
    branches:
      - pruebas
    paths:
      - .github/spec.actualizar

permissions:
  contents: write

jobs:
  actualizar-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar la guía viva
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ruta = Path("spec.md")
          texto = ruta.read_text()

          viejo = (
              "Como referencia visual comprobada, en una ventana normal Korunix usa una barra lateral "
              "con las áreas y un buscador de secciones. Al estrechar la ventana, esa barra se oculta "
              "y un botón permite abrirla sobre el contenido. El área actual aprovecha entonces todo "
              "el ancho disponible. Se rescata este comportamiento de `pruebas`, no su arquitectura interna."
          )

          nuevo = (
              "Como referencia visual y funcional comprobada, en una ventana normal Korunix usa una barra "
              "lateral con las áreas y una búsqueda global. Esa búsqueda no depende del área abierta ni se "
              "limita al nombre de las áreas: cada área aporta términos humanos de sus elementos internos. "
              "Al escribir, Korunix muestra las áreas donde puede estar la coincidencia y selecciona la primera. "
              "Aplicaciones conserva además su búsqueda propia para filtrar las fichas del catálogo una vez dentro. "
              "Al estrechar la ventana, la barra lateral se oculta y un botón permite abrir las áreas y la misma "
              "búsqueda global sobre el contenido. El área actual aprovecha entonces todo el ancho disponible. "
              "Se rescata este comportamiento de `pruebas`, no su arquitectura interna."
          )

          if texto.count(viejo) != 1:
              raise SystemExit("No encontré una sola vez el texto anterior de búsqueda.")

          ruta.write_text(texto.replace(viejo, nuevo, 1))
          PY

          rm .github/spec.actualizar
          git diff --check

      - name: Publicar
        run: |
          git config user.name "Korunix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "define búsqueda global"
          git push origin HEAD:pruebas
