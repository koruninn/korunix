name: Completar Aplicaciones temporal

on:
  push:
    branches:
      - desde-cero
    paths:
      - .github/completar-aplicaciones

permissions:
  contents: write

jobs:
  completar-y-validar:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar el bloque de Aplicaciones
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def reemplazar(texto, viejo, nuevo, nombre):
              cantidad = texto.count(viejo)
              if cantidad != 1:
                  raise SystemExit(f"{nombre}: esperaba 1 coincidencia y encontré {cantidad}")
              return texto.replace(viejo, nuevo, 1)

          # Cargo: AppStream solo pertenece a la interfaz gráfica.
          ruta = Path("Cargo.toml")
          texto = ruta.read_text()
          texto = reemplazar(
              texto,
              '''interfaz = [\n  "dep:adw",\n  "dep:gtk",\n]\n''',
              '''interfaz = [\n  "dep:adw",\n  "dep:gtk",\n  "dep:libappstream",\n]\n''',
              "Cargo feature interfaz",
          )
          texto = reemplazar(
              texto,
              '''gtk = { package = "gtk4", version = "0.11.4", optional = true }\n''',
              '''gtk = { package = "gtk4", version = "0.11.4", optional = true }\nlibappstream = { version = "0.4.0", optional = true }\n''',
              "Cargo dependencia AppStream",
          )
          ruta.write_text(texto)

          # Nix: la GUI necesita la biblioteca nativa de AppStream.
          ruta = Path("flake.nix")
          texto = ruta.read_text()
          texto = reemplazar(
              texto,
              '''      buildInputs = [\n        pkgs.gtk4\n        pkgs.libadwaita\n      ];\n''',
              '''      buildInputs = [\n        pkgs.appstream\n        pkgs.gtk4\n        pkgs.libadwaita\n      ];\n''',
              "flake buildInputs interfaz",
          )
          ruta.write_text(texto)

          # Motor de presentación de Aplicaciones.
          ruta = Path("src/aplicaciones.rs")
          texto = ruta.read_text()
          texto = reemplazar(
              texto,
              '''use std::collections::HashSet;\nuse std::path::Path;\nuse std::process::{Command, Stdio};\n''',
              '''use std::cell::RefCell;\nuse std::collections::{HashMap, HashSet};\nuse std::path::Path;\nuse std::process::{Command, Stdio};\n''',
              "imports aplicaciones",
          )
          texto = reemplazar(
              texto,
              '''pub struct VistaAplicacion {\n    pub id: String,\n    pub nombre: String,\n    pub descripcion: String,\n    pub categoria: String,\n    pub instalada: bool,\n    pub curada: bool,\n}\n\n#[derive(Clone, Debug, PartialEq, Eq)]\npub struct AplicacionResuelta {\n''',
              '''pub struct VistaAplicacion {\n    pub id: String,\n    pub nombre: String,\n    pub descripcion: String,\n    pub categoria: String,\n    pub instalada: bool,\n    pub curada: bool,\n    pub icono: Option<String>,\n}\n\n#[derive(Clone, Debug, Default, PartialEq, Eq)]\npub struct PresentacionLocal {\n    pub nombre: Option<String>,\n    pub descripcion: Option<String>,\n    pub icono: Option<String>,\n}\n\nthread_local! {\n    static PRESENTACIONES_LOCALES: RefCell<HashMap<String, PresentacionLocal>> =\n        RefCell::new(HashMap::new());\n}\n\n#[derive(Clone, Debug, PartialEq, Eq)]\npub struct AplicacionResuelta {\n''',
              "VistaAplicacion y PresentacionLocal",
          )
          texto = reemplazar(
              texto,
              '''pub fn catalogo() -> &'static [Ficha] {\n    CATALOGO\n}\n\npub fn terminos_busqueda() -> String {\n    let mut terminos = CATALOGO\n        .iter()\n        .flat_map(|ficha| [ficha.id, ficha.nombre, ficha.descripcion, ficha.categoria])\n        .collect::<Vec<_>>()\n        .join(" ");\n\n    terminos.push_str(\n        " sunshine transmisión remoto remota autoinicio steam remote play servidor dedicado gamemode millennium",\n    );\n\n    terminos.to_lowercase()\n}\n''',
              '''pub fn catalogo() -> &'static [Ficha] {\n    CATALOGO\n}\n\nconst TERMINOS_SUNSHINE: &str =\n    "sunshine transmisión remoto remota acceso autoinicio iniciar automáticamente";\nconst TERMINOS_STEAM: &str =\n    "steam juegos remote play servidor dedicado gamemode millennium";\n\npub fn coincide_especial(id: &str, consulta: &str) -> bool {\n    let consulta = consulta.trim().to_lowercase();\n    if consulta.is_empty() {\n        return true;\n    }\n\n    let terminos = match id {\n        "sunshine" => TERMINOS_SUNSHINE,\n        "steam" => TERMINOS_STEAM,\n        _ => return false,\n    };\n\n    terminos.contains(&consulta)\n}\n\npub fn hay_especial(consulta: &str) -> bool {\n    coincide_especial("sunshine", consulta) || coincide_especial("steam", consulta)\n}\n\npub fn terminos_busqueda() -> String {\n    let mut terminos = CATALOGO\n        .iter()\n        .flat_map(|ficha| [ficha.id, ficha.nombre, ficha.descripcion, ficha.categoria])\n        .collect::<Vec<_>>()\n        .join(" ");\n\n    terminos.push(' ');\n    terminos.push_str(TERMINOS_SUNSHINE);\n    terminos.push(' ');\n    terminos.push_str(TERMINOS_STEAM);\n\n    terminos.to_lowercase()\n}\n\npub fn guardar_presentaciones_locales(presentaciones: Vec<(String, PresentacionLocal)>) {\n    PRESENTACIONES_LOCALES.with(|guardadas| {\n        let mut guardadas = guardadas.borrow_mut();\n        guardadas.clear();\n        guardadas.extend(presentaciones);\n    });\n}\n\nfn presentacion_local(id: &str) -> Option<PresentacionLocal> {\n    PRESENTACIONES_LOCALES.with(|guardadas| guardadas.borrow().get(id).cloned())\n}\n\n#[cfg(feature = "interfaz")]\npub fn leer_appstream_local(ids: &[String]) -> Result<Vec<(String, PresentacionLocal)>, String> {\n    use libappstream::prelude::*;\n\n    let pool = libappstream::Pool::new();\n    pool.set_load_std_data_locations(true);\n    pool.load(None::<&libappstream::gio::Cancellable>)\n        .map_err(|error| format!("No pude leer AppStream local.\\nDetalle: {error}"))?;\n\n    let mut resultado = Vec::new();\n\n    for id in ids {\n        let Some(componentes) = pool.search(id) else {\n            continue;\n        };\n\n        let id_desktop = format!("{id}.desktop");\n        let mut mejor: Option<(bool, PresentacionLocal)> = None;\n\n        for indice in 0..componentes.size() {\n            let Some(componente) = componentes.index_safe(indice) else {\n                continue;\n            };\n\n            let paquete_exacto = componente\n                .pkgnames()\n                .iter()\n                .any(|paquete| paquete.as_str() == id);\n            let id_exacto = componente\n                .id()\n                .as_deref()\n                .map(|actual| actual == id || actual == id_desktop)\n                .unwrap_or(false);\n\n            if !paquete_exacto && !id_exacto {\n                continue;\n            }\n\n            let icono = componente\n                .icon_stock()\n                .and_then(|icono| icono.name())\n                .map(|nombre| nombre.to_string());\n\n            // Los textos del catálogo curado ya están escritos en español.\n            // Nombre y descripción de AppStream solo se guardan cuando el\n            // paquete coincide exactamente; una coincidencia por .desktop\n            // puede aportar icono, pero no reemplaza texto humano fiable.\n            let presentacion = PresentacionLocal {\n                nombre: paquete_exacto\n                    .then(|| componente.name().map(|valor| valor.to_string()))\n                    .flatten(),\n                descripcion: paquete_exacto\n                    .then(|| componente.summary().map(|valor| valor.to_string()))\n                    .flatten(),\n                icono,\n            };\n\n            let reemplazar = mejor\n                .as_ref()\n                .map(|(era_paquete, _)| paquete_exacto && !*era_paquete)\n                .unwrap_or(true);\n\n            if reemplazar {\n                mejor = Some((paquete_exacto, presentacion));\n            }\n\n            if paquete_exacto {\n                break;\n            }\n        }\n\n        if let Some((_, presentacion)) = mejor {\n            resultado.push((id.clone(), presentacion));\n        }\n    }\n\n    Ok(resultado)\n}\n''',
              "helpers aplicaciones y AppStream",
          )
          texto = reemplazar(
              texto,
              '''        .map(|ficha| VistaAplicacion {\n            id: ficha.id.to_string(),\n            nombre: ficha.nombre.to_string(),\n            descripcion: ficha.descripcion.to_string(),\n            categoria: ficha.categoria.to_string(),\n            instalada: instaladas_set.contains(ficha.id),\n            curada: true,\n        })\n''',
              '''        .map(|ficha| {\n            let local = presentacion_local(ficha.id);\n            VistaAplicacion {\n                id: ficha.id.to_string(),\n                nombre: ficha.nombre.to_string(),\n                descripcion: ficha.descripcion.to_string(),\n                categoria: ficha.categoria.to_string(),\n                instalada: instaladas_set.contains(ficha.id),\n                curada: true,\n                icono: local.and_then(|presentacion| presentacion.icono),\n            }\n        })\n''',
              "vista curada enriquecida",
          )
          texto = reemplazar(
              texto,
              '''        resultado.push(VistaAplicacion {\n            id: id.clone(),\n            nombre: nombre_desde_id(id),\n            descripcion:\n                "Aplicación elegida. Korunix conserva tu elección aunque no tenga ficha curada."\n                    .to_string(),\n            categoria: "Otras elegidas".to_string(),\n            instalada: true,\n            curada: false,\n        });\n''',
              '''        let local = presentacion_local(id);\n        resultado.push(VistaAplicacion {\n            id: id.clone(),\n            nombre: local\n                .as_ref()\n                .and_then(|presentacion| presentacion.nombre.clone())\n                .unwrap_or_else(|| nombre_desde_id(id)),\n            descripcion: local\n                .as_ref()\n                .and_then(|presentacion| presentacion.descripcion.clone())\n                .unwrap_or_else(|| {\n                    "Aplicación elegida. Korunix conserva tu elección aunque no tenga ficha curada."\n                        .to_string()\n                }),\n            categoria: "Otras elegidas".to_string(),\n            instalada: true,\n            curada: false,\n            icono: local.and_then(|presentacion| presentacion.icono),\n        });\n''',
              "vista libre enriquecida",
          )
          texto = reemplazar(
              texto,
              '''    fn buscar_usa_nombre_descripcion_y_categoria() {\n''',
              '''    fn las_opciones_propias_participan_en_la_busqueda_local() {\n        assert!(coincide_especial("steam", "remote play"));\n        assert!(coincide_especial("sunshine", "remoto"));\n        assert!(!hay_especial("karere"));\n    }\n\n    #[test]\n    fn buscar_usa_nombre_descripcion_y_categoria() {\n''',
              "test especiales",
          )
          ruta.write_text(texto)

          # Interfaz: iconos AppStream y fichas propias de Sunshine/Steam.
          ruta = Path("src/interfaz.rs")
          texto = ruta.read_text()
          texto = reemplazar(
              texto,
              '''            let boton = gtk::Button::with_label(if vista.instalada {\n                "Quitar"\n            } else {\n                "Instalar"\n            });\n''',
              '''            if let Some(icono) = vista.icono.as_deref() {\n                let imagen = gtk::Image::from_icon_name(icono);\n                imagen.set_pixel_size(32);\n                imagen.set_valign(gtk::Align::Center);\n                fila.add_prefix(&imagen);\n            }\n\n            let boton = gtk::Button::with_label(if vista.instalada {\n                "Quitar"\n            } else {\n                "Instalar"\n            });\n''',
              "icono fila aplicación",
          )
          texto = reemplazar(
              texto,
              '''    if !consulta.is_empty() && vistas.is_empty() {\n''',
              '''    if !consulta.is_empty() && vistas.is_empty() && !aplicaciones::hay_especial(&consulta) {\n''',
              "evitar Nix para especiales",
          )
          texto = reemplazar(
              texto,
              '''    let aplicaciones_opciones_grupo = adw::PreferencesGroup::builder()\n        .title("Con opciones propias")\n        .description(\n            "Apagar una función principal conserva sus preferencias internas para cuando vuelva a activarse.",\n        )\n        .build();\n''',
              '''    let sunshine_grupo = adw::PreferencesGroup::builder()\n        .title("Sunshine")\n        .description(\n            "Acceso y transmisión remota. Sus preferencias internas se conservan aunque lo apagues.",\n        )\n        .build();\n\n    let steam_grupo = adw::PreferencesGroup::builder()\n        .title("Steam")\n        .description(\n            "Juegos y transmisión. Korunix deriva GameMode, Millennium y las reglas necesarias.",\n        )\n        .build();\n''',
              "grupos especiales",
          )
          texto = reemplazar(
              texto,
              '''    let sunshine = adw::SwitchRow::builder()\n        .title("Sunshine")\n        .subtitle("Acceso y transmisión remota.")\n        .build();\n''',
              '''    let sunshine = adw::SwitchRow::builder()\n        .title("Activar Sunshine")\n        .subtitle("Deja disponible el servidor de transmisión remota.")\n        .build();\n''',
              "fila principal Sunshine",
          )
          texto = reemplazar(
              texto,
              '''    let steam = adw::SwitchRow::builder()\n        .title("Steam")\n        .subtitle("Korunix deriva GameMode, Millennium y la integración visual.")\n        .build();\n''',
              '''    let steam = adw::SwitchRow::builder()\n        .title("Activar Steam")\n        .subtitle("Instala Steam y deja sus opciones propias en esta misma ficha.")\n        .build();\n''',
              "fila principal Steam",
          )
          texto = reemplazar(
              texto,
              '''    aplicaciones_opciones_grupo.add(&sunshine);\n    aplicaciones_opciones_grupo.add(&sunshine_autoinicio);\n    aplicaciones_opciones_grupo.add(&steam);\n    aplicaciones_opciones_grupo.add(&steam_remote_play);\n    aplicaciones_opciones_grupo.add(&steam_servidor);\n''',
              '''    sunshine_grupo.add(&sunshine);\n    sunshine_grupo.add(&sunshine_autoinicio);\n    steam_grupo.add(&steam);\n    steam_grupo.add(&steam_remote_play);\n    steam_grupo.add(&steam_servidor);\n''',
              "agrupar opciones propias",
          )
          texto = reemplazar(
              texto,
              '''    contenido_aplicaciones.append(&aplicaciones_busqueda_grupo);\n\n    let catalogo_aplicaciones = gtk::Box::new(gtk::Orientation::Vertical, 18);\n    let seleccionadas_aplicaciones = Rc::new(RefCell::new(Vec::<String>::new()));\n    contenido_aplicaciones.append(&catalogo_aplicaciones);\n    contenido_aplicaciones.append(&aplicaciones_opciones_grupo);\n''',
              '''    contenido_aplicaciones.append(&aplicaciones_busqueda_grupo);\n\n    let catalogo_aplicaciones = gtk::Box::new(gtk::Orientation::Vertical, 18);\n    let seleccionadas_aplicaciones = Rc::new(RefCell::new(Vec::<String>::new()));\n    contenido_aplicaciones.append(&catalogo_aplicaciones);\n    contenido_aplicaciones.append(&sunshine_grupo);\n    contenido_aplicaciones.append(&steam_grupo);\n''',
              "orden de Aplicaciones",
          )
          texto = reemplazar(
              texto,
              '''        let ocupado = Rc::clone(&ocupado);\n\n        busqueda_aplicaciones.connect_search_changed(move |_| {\n            recargar_aplicaciones(\n''',
              '''        let ocupado = Rc::clone(&ocupado);\n        let sunshine_grupo = sunshine_grupo.clone();\n        let steam_grupo = steam_grupo.clone();\n\n        busqueda_aplicaciones.connect_search_changed(move |entrada| {\n            let consulta = entrada.text();\n            sunshine_grupo.set_visible(aplicaciones::coincide_especial("sunshine", &consulta));\n            steam_grupo.set_visible(aplicaciones::coincide_especial("steam", &consulta));\n\n            recargar_aplicaciones(\n''',
              "filtro de fichas especiales",
          )
          texto = reemplazar(
              texto,
              '''    ventana.present();\n\n    {\n        let controles_actualizaciones: Vec<gtk::Widget> = vec![\n''',
              '''    ventana.present();\n\n    // AppStream es un enriquecimiento local y secundario. La ventana y el\n    // catálogo curado ya están disponibles cuando empieza esta lectura.\n    {\n        let mut ids = aplicaciones::catalogo()\n            .iter()\n            .map(|ficha| ficha.id.to_string())\n            .collect::<Vec<_>>();\n        for id in seleccionadas_aplicaciones.borrow().iter() {\n            if !ids.iter().any(|actual| actual == id) {\n                ids.push(id.clone());\n            }\n        }\n\n        let (envio, recepcion) = mpsc::channel();\n        thread::spawn(move || {\n            let _ = envio.send(aplicaciones::leer_appstream_local(&ids));\n        });\n\n        let catalogo = catalogo_aplicaciones.clone();\n        let contador = contador_aplicaciones.clone();\n        let busqueda = busqueda_aplicaciones.clone();\n        let seleccionadas = Rc::clone(&seleccionadas_aplicaciones);\n        let raiz_appstream = raiz.clone();\n        let mensaje = mensaje_configuracion.clone();\n        let aviso_appstream = aviso.clone();\n        let aplicar = boton_aplicar.clone();\n        let ocupado_appstream = Rc::clone(&ocupado);\n\n        glib::timeout_add_local(Duration::from_millis(80), move || match recepcion.try_recv() {\n            Ok(Ok(presentaciones)) => {\n                aplicaciones::guardar_presentaciones_locales(presentaciones);\n                recargar_aplicaciones(\n                    &catalogo,\n                    &contador,\n                    &busqueda,\n                    &seleccionadas,\n                    &raiz_appstream,\n                    &mensaje,\n                    &aviso_appstream,\n                    &aplicar,\n                    &ocupado_appstream,\n                );\n                glib::ControlFlow::Break\n            }\n            Ok(Err(_)) | Err(TryRecvError::Disconnected) => glib::ControlFlow::Break,\n            Err(TryRecvError::Empty) => glib::ControlFlow::Continue,\n        });\n    }\n\n    {\n        let controles_actualizaciones: Vec<gtk::Widget> = vec![\n''',
              "carga AppStream después de mostrar ventana",
          )
          ruta.write_text(texto)

          # Hoja de continuidad: registra avance, no lo declara cerrado todavía.
          ruta = Path("RUTA.md")
          texto = ruta.read_text()
          ancla = '''La experiencia gráfica ya no se amplía como una única página larga. El motor probado se conserva; lo que cambia es cómo se presenta.\n'''
          registro = '''Cuarto avance funcional preparado:\n\n```text\nAplicaciones\n→ abre con el catálogo curado sin esperar AppStream\n→ AppStream local se lee después, fuera del arranque visible\n→ una coincidencia fiable puede aportar icono y datos humanos a elecciones libres\n→ una coincidencia ambigua nunca reemplaza la ficha curada\n→ Sunshine y Steam tienen cada uno su propia ficha con sus subopciones\n→ buscar Steam o Sunshine no dispara una resolución Nixpkgs equivocada\n```\n\nEste avance necesita todavía la revisión gráfica real antes de cerrar el frente.\n\n''' + ancla
          texto = reemplazar(texto, ancla, registro, "RUTA avance Aplicaciones")
          ruta.write_text(texto)
          PY

          rm -f .github/probar-appstream
          rm -f .github/workflows/probar-appstream-temporal.yml
          rm -f .github/completar-aplicaciones
          rm -f .github/workflows/completar-aplicaciones-temporal.yml

      - name: Preparar bibliotecas de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y libappstream-dev libgtk-4-dev libadwaita-1-dev pkg-config

      - name: Actualizar Cargo.lock solo con la dependencia nueva
        run: cargo check --features interfaz --bin korunix-interfaz

      - name: Formato e integridad
        run: |
          cargo fmt --all
          git diff --check

      - name: Probar comportamiento
        run: cargo test --locked -- --test-threads=1

      - name: Probar la interfaz
        run: cargo check --locked --features interfaz --bin korunix-interfaz

      - name: Preparar Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Probar el paquete Nix de la interfaz
        run: nix build .#interfaz --no-link

      - name: Publicar solo si todo pasó
        run: |
          git config user.name "Korunix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "completa las fichas de Aplicaciones"
          git push origin HEAD:desde-cero
