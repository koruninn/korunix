name: Probar AppStream temporal

on:
  push:
    branches:
      - desde-cero
    paths:
      - .github/probar-appstream

jobs:
  probar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Preparar bibliotecas
        run: |
          sudo apt-get update
          sudo apt-get install -y libappstream-dev pkg-config
      - name: Probar la API de AppStream
        run: |
          cargo add libappstream@0.4.0
          mkdir -p examples
          cat > examples/probar_appstream.rs <<'EOF'
          use libappstream::prelude::*;

          fn main() {
              let pool = libappstream::Pool::new();
              pool.set_load_std_data_locations(true);
              pool.set_locale("es");
              pool.load(None::<&libappstream::gio::Cancellable>).unwrap();

              if let Some(componentes) = pool.search("firefox") {
                  println!("cantidad={}", componentes.size());
                  for indice in 0..componentes.size() {
                      let Some(componente) = componentes.index_safe(indice) else {
                          continue;
                      };
                      println!(
                          "id={:?} nombre={:?} resumen={:?} paquetes={:?}",
                          componente.id(),
                          componente.name(),
                          componente.summary(),
                          componente.pkgnames()
                      );
                      if let Some(icono) = componente.icon_stock() {
                          println!("icono={:?}", icono.name());
                      }
                  }
              }
          }
          EOF
          cargo check --example probar_appstream
          cargo run --quiet --example probar_appstream
