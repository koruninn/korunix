name: Revisar Korunix

on:
  push:
  pull_request:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la repo
        uses: actions/checkout@v4

      - name: Instalar Nix
        uses: cachix/install-nix-action@v31

      - name: Revisar que el flake evalúe
        run: nix flake check --no-build

      - name: Construir todos los equipos sin instalarlos
        shell: bash
        run: |
          set -euo pipefail
          equipos="$(nix eval --raw .#nixosConfigurations --apply 'x: builtins.concatStringsSep " " (builtins.attrNames x)')"
          for equipo in $equipos; do
            echo "Construyendo $equipo"
            nix build ".#nixosConfigurations.$equipo.config.system.build.toplevel" --no-link
          done

      - name: Buscar código Nix innecesario o sospechoso
        continue-on-error: true
        run: |
          nix shell nixpkgs#deadnix nixpkgs#statix -c deadnix --fail .
          nix shell nixpkgs#deadnix nixpkgs#statix -c statix check .
