[package]
name = "korunix"
version = "0.1.0"
edition = "2021"

[features]
default = []
interfaz = [
  "dep:adw",
  "dep:gtk",
  "dep:libappstream",
]

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"], optional = true }
gtk = { package = "gtk4", version = "0.11.4", optional = true }
libappstream = { version = "0.4.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

[[bin]]
name = "korunix"
path = "src/main.rs"

[[bin]]
name = "korunix-interfaz"
path = "src/interfaz.rs"
required-features = ["interfaz"]
