[package]
name = "korunix"
version = "0.1.0"
edition = "2021"
publish = false
description = "Motor e interfaz de Korunix"

[features]
default = []
interfaz = [
  "dep:adw",
  "dep:gtk",
  "dep:serde_json",
]

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"], optional = true }
gtk = { package = "gtk4", version = "0.11.4", optional = true }
serde_json = { version = "1.0", optional = true }

[[bin]]
name = "korunix"
path = "sistema/programa/principal.rs"

[[bin]]
name = "korunix-interfaz"
path = "sistema/interfaz/principal.rs"
required-features = ["interfaz"]
