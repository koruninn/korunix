# Así aparece esta computadora en la red.
nombre = "korunix"

# "estable" cambia menos; "inestable" trae cosas más nuevas.
canal = "inestable"

# Cada bloque [[personas]] es una cuenta local.
[[personas]]
cuenta = "koru"
nombre = "André"
administrador = true

[escritorio]
# Este es el escritorio que se abre por defecto.
principal = "niri"

# Estos escritorios quedan disponibles al iniciar sesión.
instalados = ["niri", "hyprland", "plasma", "cinnamon"]

[idioma]
sistema = "español"
region = "Perú"

[teclado]
distribuciones = ["españa", "latinoamérica"]
cambio = "alt+shift"

[monitor]
resolucion = "1920x1080"
hz = 120

[almacenamiento]
# Korunix ya conoce el disco por dentro; aquí solo eliges si quieres tenerlo disponible.
disponibles = ["datos"]

[sunshine]
activo = true
autoinicio = true

[impresion]
activa = true
controlador = "epson-201207w"

[virtualizacion]
activa = true

[aplicaciones]
# Pon aquí las aplicaciones que quieres tener.
instaladas = [
  "firefox",
  "karere",
  "blender",
]
