# Así aparece esta computadora en la red.
nombre = "korunix"

# "estable" cambia menos; "inestable" trae cosas más nuevas.
canal = "inestable"

# Cada bloque [[personas]] es una cuenta local.
[[personas]]
cuenta = "koru"
nombre = "André"
administrador = true

# El avatar sí puede vivir con Korunix; no contiene credenciales.
avatar = "avatar-koru.jpg"

# La clave privada sigue en ~/.ssh. Aquí solo se recuerda cuál usar para GitHub.
clave_github = ".ssh/blep"

[escritorio]
# Este es el escritorio que se abre por defecto.
principal = "niri"

# Estos escritorios quedan disponibles al iniciar sesión.
instalados = ["niri", "hyprland", "plasma", "cinnamon"]

[apariencia]
# La GUI de Noctalia tiene esta elección efectiva actualmente.
estilo = "dinamico"
modo = "automatico"

[idioma]
sistema = "español"
region = "Perú"

[teclado]
distribuciones = ["españa", "latinoamérica"]
cambio = "alt+shift"

[monitor]
resolucion = "1920x1080"
hz = 120

[almacenamiento]
# Korunix ya conoce el disco por dentro; aquí solo eliges si quieres tenerlo disponible.
disponibles = ["datos"]

[bluetooth]
activo = true

[sunshine]
activo = true
autoinicio = true

[impresion]
activa = true
controlador = "epson-201207w"

[virtualizacion]
activa = true

[steam]
activo = true
remote_play = true
servidor_dedicado = true

[aplicaciones]
# Estas son las aplicaciones que quieres ver y usar.
# Las dependencias internas no se escriben aquí.
instaladas = [
  "birdfont",
  "darktable",
  "firefox",
  "fontforge",
  "gimp",
  "google-chrome",
  "heroic",
  "inkscape",
  "kate",
  "karere",
  "kdenlive",
  "krita",
  "localsend",
  "lutris",
  "obs-studio",
  "obsidian",
  "onlyoffice-desktopeditors",
  "peazip",
  "polyglot",
  "prismlauncher",
  "protonplus",
  "pywalfox-native",
  "rapidraw",
  "rar",
  "scrcpy",
  "spotdl",
  "thunderbird",
  "unrar",
  "vesktop",
  "vlc",
  "vscode",
  "blender",
  "cohesion",
  "figma-linux-next",
  "genshin-impact",
  "honkai-star-rail",
  "spotify",
]
