# Fetch conserva la intención compacta del Fastfetch histórico de Korunix.
# La terminal cotidiana muestra solo datos útiles y evita llenar la pantalla con
# detalles que ya pertenecen a diagnósticos o vistas avanzadas.

# Información visible, en el mismo orden conceptual que la configuración de main.
os
kernel
shell
wm
cpu
memory
disk
colors

# El logo 3D sigue formando parte de Fetch, pero ocupa menos espacio para que la
# información no obligue a abrir una terminal innecesariamente ancha.
label_color=green
separator=─
spin=xy
speed=0.65
size=0.65
depth=0.60
