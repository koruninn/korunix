# Fish es la shell interactiva predeterminada de Korunix.
# El saludo original se oculta para que la terminal empiece limpia y Fetch pueda
# presentar la información útil del equipo sin texto duplicado.
set -g fish_greeting ""

# Fetch se ejecuta únicamente cuando hay una persona usando la terminal. Scripts,
# procesos no interactivos y tareas del sistema no reciben esta salida visual.
if status is-interactive
    fetch
end
